name: Release Request

on:
  workflow_call:
    inputs:
      discussion-category-name:
        default: ''
        description: Specifies the name of the category to create a discussion in when the release is published.
        required: false
        type: string
      draft:
        default: true
        description: If true, the release created will be drafted rather than published.
        required: false
        type: boolean
      generate-release-notes:
        default: false
        description: If true, the release name and notes will be generated if they were unspecified at the time of publish.
        required: false
        type: boolean
      make-latest:
        default: 'legacy'
        description: Specifies how the latest release is determined. For more information, see https://docs.github.com/en/rest/releases/releases?apiVersion=2022-11-28#create-a-release.
        required: false
        type: string
      release-request-label:
        default: 'release'
        description: The label that identifies release requests.
        required: false
        type: string
    outputs:
      release-tag:
        description: The tag of the release.
        value: ${{ jobs.handle-release-request.outputs.release-tag }}
      release-title:
        description: The title of the release.
        value: ${{ jobs.handle-release-request.outputs.release-title }}

defaults:
  run:
    shell: bash

jobs:
  process:
    name: ${{ github.event.action == 'closed' && 'Resolve' || 'Verify' }}
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged }}
    outputs:
      release-tag: ${{ steps.extract.outputs.release-tag }}
      release-title: ${{ steps.extract.outputs.release-title }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 1

    steps:
      - name: Extract Information
        id: extract
        env:
          IS_RELEASE_REQUEST: ${{ contains(github.event.pull_request.labels.*.name, inputs.release-request-label) }}
          IS_ACTOR_AUTHORIZED: ${{ github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' }}
          IS_EXTERNAL_REQUEST: ${{ github.event.pull_request.base.repo.full_name != github.event.pull_request.head.repo.full_name }}
          RELEASE_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ $IS_RELEASE_REQUEST != 'true' ]] ; then
            echo 'Skipping pull request, because it wasn'"'"'t labeled as release.'
            echo 'STOP_JOB=true' >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ $IS_ACTOR_AUTHORIZED != 'true' ]] ; then
            echo 'Only collaborators or the repository owner may create release requests.'
            exit 1
          fi

          if [[ $IS_EXTERNAL_REQUEST == 'true' ]] ; then
            echo 'Release requests'"'"' heads must be in the same repository as the bases.'
            exit 1
          fi

          request_title_regex='^(Prer|R)elease (v[0-9]+\.[0-9]+(\.[0-9]+(\.[0-9]+)?)?(-[a-zA-Z0-9_]+)?)( \| (.+))?$'

          if [[ $RELEASE_REQUEST_TITLE =~ $request_title_regex ]] ; then
            echo 'release-tag='"${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo 'release-title='"${BASH_REMATCH[7]}" >> "$GITHUB_OUTPUT"
          else
            echo 'Release request'"'"'s title is not in the correct format.'
            exit 1
          fi

      - name: Get Release Status
        if: ${{ env.STOP_JOB != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.extract.outputs.release-tag }}
        run: |
          status_code="$(curl -ILs -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"

          if [[ $status_code -ne 404 ]] ; then
            if [[ $status_code -eq 200 ]] ; then
              echo 'A release for the tag "'"$RELEASE_TAG"'" already exists.'
            else
              echo "Unexpected status code $status_code."
            fi
            exit 1
          fi

      - name: Create Release
        if: ${{ env.STOP_JOB != 'true' && github.event.action == 'closed' && github.event.pull_request.merged }}
        env:
          DISCUSSION_CATEGORY_NAME: ${{ inputs.discussion-category-name }}
          GENERATE_RELEASE_NOTES: ${{ inputs.generate-release-notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_DRAFT: ${{ inputs.draft }}
          MAKE_LATEST: ${{ inputs.make-latest }}
          MAKE_PRERELEASE: ${{ startsWith(github.event.pull_request.title, 'Pre') }}
          RELEASE_NOTES: ${{ github.event.pull_request.body }}
          RELEASE_TAG: ${{ steps.extract.outputs.release-tag }}
          RELEASE_TITLE: ${{ steps.extract.outputs.release-title }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          RELEASE_ARGUMENTS=('-R' "$GITHUB_REPOSITORY" '--target' "$RELEASE_TARGET")

          if [[ -v RELEASE_TITLE ]] ; then
            RELEASE_ARGUMENTS+=('-t' "$RELEASE_TITLE")
          fi

          if [[ -v RELEASE_NOTES ]] ; then
            RELEASE_ARGUMENTS+=('-n' "$RELEASE_NOTES")
          fi

          if [[ -v DISCUSSION_CATEGORY_NAME ]] ; then
            RELEASE_ARGUMENTS+=('--discussion-category' "$DISCUSSION_CATEGORY_NAME")
          fi

          if [[ $MAKE_DRAFT == 'true' ]] ; then
            RELEASE_ARGUMENTS+=('-d')
          fi

          if [[ $GENERATE_RELEASE_NOTES == 'true' ]] ; then
            RELEASE_ARGUMENTS+=('--generate-notes')
          fi

          if [[ $MAKE_PRERELEASE == 'true' ]] ; then
            RELEASE_ARGUMENTS+=('-p')
          elif [[ $MAKE_LATEST != 'legacy' ]] ; then
            RELEASE_ARGUMENTS+=('--latest='"$MAKE_LATEST")
          fi

          gh release create "$RELEASE_TAG" "${RELEASE_ARGUMENTS[@]}"
